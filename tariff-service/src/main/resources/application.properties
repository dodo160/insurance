server.port=${TARIFF_PORT:8081}
spring.datasource.url=${TARIFF_DB_URL:jdbc:mysql://localhost:3306/tariff?serverTimezone=Europe/Bratislava&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${TARIFF_DB_USERNAME}
spring.datasource.password=${TARIFF_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.flyway.locations=classpath:db/migration/common

app.openapi.title=Tariff API
app.openapi.description=REST API for tariff management
app.openapi.version=1.0.0
